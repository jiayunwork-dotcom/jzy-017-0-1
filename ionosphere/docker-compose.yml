services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ionosphere
      POSTGRES_PASSWORD: ionosphere
      POSTGRES_DB: ionosphere
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ionosphere -d ionosphere"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://ionosphere:ionosphere@db:5432/ionosphere?sslmode=disable"
      GROUND_ALTITUDE: "0"
      TOP_ALTITUDE: "2000000"
      PROFILE_STEP: "2000"
      INTEGRATION_TOLERANCE: "1e-6"
    ports:
      - "8080:8080"

volumes:
  pgdata:
